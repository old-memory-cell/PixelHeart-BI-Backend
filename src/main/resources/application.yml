server:
  port: 8080
  servlet:
    context-path: /api


spring:
  application:
    name: inoli-bi

  profiles:
    active: local # 激活本地配置文件

  # mysql 配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/${db.db_name}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${db.username}
    password: ${db.password}

  data:
    redis:
      host: localhost
      port: 6379

  # ai 的相关配置
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY} # deepseek api key
      base-url: https://api.deepseek.com # deepseek api base url
      chat:
        model: deepseek-flash # 模型名称

  # rabbit mq 配置
  rabbitmq:
    addresses: ${rabbitmq.host}
    port: ${rabbitmq.port}
    virtual-host: ${rabbitmq.virtual-host}
    username: ${rabbitmq.username}
    password: ${rabbitmq.password}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
    publisher-confirm-type: none # 发布确认
    publisher-returns: false # 发布返回

# swagger
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zzsd.inolibi.controller # swagger 扫描包文档

knife4j:
  enable: true # 增强Knife4j
  setting:
    language: zh_cn # 中文


# mybatis-plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml # mapper 文件位置
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启SQL日志输出
  global-config:
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段名
      logic-delete-value: 1 # 逻辑已删除值
      logic-not-delete-value: 0 # 逻辑未删除值


#配置事务管理日志级别
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: info

#阿里云oss
aliyun:
  oss:
    endpoint: ${aliyun.oss.endpoint}
    bucketName: ${aliyun.oss.bucketName}
    region: ${aliyun.oss.region}
